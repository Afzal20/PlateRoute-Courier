name: courier
description: "PlateRoute Courier — claim task offers, navigate, deliver, earn."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1

  # State management (locked: Riverpod)
  flutter_riverpod: ^3.0.0

  # Routing + deep links (MOB-C-03)
  go_router: ^16.0.0

  # Networking: dio + interceptors (bearer JWT, Idempotency-Key, X-App-Version)
  dio: ^5.8.0
  intl: ^0.20.0

  # Tokens must never live in prefs (MOB-C-01)
  flutter_secure_storage: ^10.0.0

  # Location: foreground service pings + motion gating (NFR-16)
  geolocator: ^14.0.3
  permission_handler: ^12.0.0

  # Haptic families A–E (haptics outrank audio in helmets)
  vibration: ^3.1.0

  # Local action queue / task log backing store (MOB-C-06)
  path_provider: ^2.1.0
  connectivity_plus: ^6.1.0

  # POD capture (FR-DLV-03)
  camera: ^0.11.0

  # Navigation handoff + calls
  url_launcher: ^6.3.0
  equatable: ^2.1.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
